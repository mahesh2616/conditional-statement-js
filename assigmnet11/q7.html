
<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
    <title>Change Font Size</title>
</head>
<body>
	<p id="text">Pune Is Beautiful City</p>
	<button onclick="changeFontSize()">Change Font Size</button>
 
	<script>
    	function changeFontSize() {
            document.getElementById('text').style.fontSize = '40px';
    	}
	</script>
</body>
</html>
