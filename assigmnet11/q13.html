 
<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
    <title>Remove List Item</title>
</head>
<body>
	<ul id="myList">
    	<li>Item 1</li>
    	<li>Item 2</li>
    	<li>Item 3</li>
        <li>Item 4</li>
        <li>Item 5</li>
        <li>Item 6</li>
        <li>Item 7</li>
        <li>Item 8</li>
        <li>Item 9</li>
        <li>Item 10</li>
        <li>Item 11</li>
        <li>Item 12</li>
        <li>Item 13</li>
	</ul>
	<button onclick="removeItem()">Remove Last Item</button>
 
	<script>
    	function removeItem() {
        	var list = document.getElementById('myList');
            list.removeChild(list.lastElementChild);
    	}
	</script>
</body>
</html>
