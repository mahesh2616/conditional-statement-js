 
<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
    <title>Change Button Style on Click</title>
</head>
<body>
	<button id="myButton" onclick="changeButtonStyle()">Click Me</button>
 
	<script>
    	function changeButtonStyle() {
        	var button = document.getElementById('myButton');
            button.style.backgroundColor = 'green';
            button.style.color = 'white';
    	}
	</script>
</body>
</html>
