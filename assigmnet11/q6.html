<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
    <title>Change Image Source</title>
</head>
<body>
	<img id="image" src="rainy-forest-photo.jpg" alt="Image" width="500"  height="450">
	<button onclick="changeImage()">Change Image</button>
 
	<script>
    	function changeImage() {
            document.getElementById('image').src = 'dried earth.jpg';
    	}
	</script>
</body>
</html>
