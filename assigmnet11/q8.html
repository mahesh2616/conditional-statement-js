<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Text Shadow</title>
</head>

<body>

    <p id="text">Parikarma Engineering College</p>

    <button onclick="changeTextColor()">Change Text</button>

    <script>

        function changeTextColor() {

            document.getElementById('text').style.color = 'purple';

            document.getElementById('text').style.fontSize = '30px';

            document.body.style.backgroundColor = 'orange';

            document.getElementById('text').style.textShadow = '1px 1px 1px black';

        }

    </script>

</body>
</html>
